<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of Stride Band, fitness band">
  <defs>
    <radialGradient id="room" cx=".38" cy=".28" r=".95"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9EDEB"/><stop offset="1" stop-color="#CDD3D0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CFCC" stop-opacity="0"/><stop offset="1" stop-color="#C3CAC6" stop-opacity=".75"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#1F2A30" stop-opacity=".45"/><stop offset="1" stop-color="#1F2A30" stop-opacity="0"/></radialGradient>
    <filter id="depth" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="4" specularConstant=".7" specularExponent="60" lighting-color="#ffffff" result="shine">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="gloss"/>
      <feDropShadow in="SourceGraphic" dx="10" dy="18" stdDeviation="14" flood-color="#1F2A30" flood-opacity=".28" result="cast"/>
      <feMerge><feMergeNode in="cast"/><feMergeNode in="gloss"/></feMerge>
    </filter>
    <linearGradient id="m0" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#9b767e"/><stop offset=".35" stop-color="#83545e"/>
      <stop offset=".62" stop-color="#72454e"/><stop offset="1" stop-color="#44292f"/></linearGradient><linearGradient id="m1" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#83666e"/><stop offset=".35" stop-color="#64404a"/>
      <stop offset=".62" stop-color="#55323b"/><stop offset="1" stop-color="#331e23"/></linearGradient><linearGradient id="m2" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#5e6468"/><stop offset=".35" stop-color="#363d42"/>
      <stop offset=".62" stop-color="#282f34"/><stop offset="1" stop-color="#181c1f"/></linearGradient>
  </defs>
  <ellipse cx="408" cy="520" rx="250" ry="34" fill="url(#shadow)"/>
  <g filter="url(#depth)"><rect x="362" y="95" width="76" height="420" rx="38" fill="url(#m1)"/><rect x="345" y="215" width="110" height="180" rx="40" fill="url(#m0)"/>
        <rect x="362" y="233" width="76" height="144" rx="26" fill="url(#m2)"/><path d="M378 305h14l8-22 12 40 9-18h12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of Pebble Sport, sport earbuds">
  <defs>
    <radialGradient id="room" cx=".38" cy=".28" r=".95"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9EDEB"/><stop offset="1" stop-color="#CDD3D0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CFCC" stop-opacity="0"/><stop offset="1" stop-color="#C3CAC6" stop-opacity=".75"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#1F2A30" stop-opacity=".45"/><stop offset="1" stop-color="#1F2A30" stop-opacity="0"/></radialGradient>
    <filter id="depth" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="soft"/>
      <feSpecularLighting in="soft" surfaceScale="4" specularConstant=".7" specularExponent="60" lighting-color="#ffffff" result="shine">
        <feDistantLight azimuth="225" elevation="48"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="gloss"/>
      <feDropShadow in="SourceGraphic" dx="10" dy="18" stdDeviation="14" flood-color="#1F2A30" flood-opacity=".28" result="cast"/>
      <feMerge><feMergeNode in="cast"/><feMergeNode in="gloss"/></feMerge>
    </filter>
    <linearGradient id="m0" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#5f7585"/><stop offset=".35" stop-color="#385366"/>
      <stop offset=".62" stop-color="#294456"/><stop offset="1" stop-color="#192934"/></linearGradient><linearGradient id="m1" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#55656f"/><stop offset=".35" stop-color="#2a3e4b"/>
      <stop offset=".62" stop-color="#1d303d"/><stop offset="1" stop-color="#111d24"/></linearGradient><linearGradient id="m2" gradientUnits="userSpaceOnUse" x1="180" y1="110" x2="620" y2="520">
      <stop offset="0" stop-color="#e2a875"/><stop offset=".35" stop-color="#db9253"/>
      <stop offset=".62" stop-color="#c88144"/><stop offset="1" stop-color="#774d29"/></linearGradient>
  </defs>
  <ellipse cx="408" cy="520" rx="250" ry="34" fill="url(#shadow)"/>
  <g filter="url(#depth)"><rect x="250" y="330" width="300" height="150" rx="70" fill="url(#m0)"/><path d="M250 388h300" stroke="url(#m1)" stroke-width="6"/>
        <circle cx="315" cy="245" r="52" fill="url(#m0)"/><rect x="298" y="270" width="34" height="92" rx="17" fill="url(#m1)"/>
        <circle cx="485" cy="245" r="52" fill="url(#m0)"/><rect x="468" y="270" width="34" height="92" rx="17" fill="url(#m1)"/>
        <circle cx="315" cy="238" r="20" fill="url(#m2)"/><circle cx="485" cy="238" r="20" fill="url(#m2)"/><circle cx="400" cy="432" r="7" fill="url(#m2)"/></g>
</svg>
